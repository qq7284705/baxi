plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xiaobai.hongbao'
    compileSdk 34

    defaultConfig {
        applicationId "com.xiaobai.hongbao"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        // We ship native dexkit .so uncompressed-ready
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        // dexkit ships its own .so; keep them extractable
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    // Xposed API (compileOnly: provided by the LSPosed framework at runtime)
    compileOnly 'de.robv.android.xposed:api:82'

    // DexKit: locate obfuscated WeChat classes/methods at runtime
    implementation 'org.luckypray:dexkit:2.0.3'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
